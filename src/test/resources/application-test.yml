spring:
  application:
    name: cloudledger-platform-test
  datasource:
    url: jdbc:h2:mem:cloudledgertest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  data:
    redis:
      repositories:
        enabled: false
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      auto-offset-reset: earliest

cloudledger:
  jwt:
    secret: 4c6f75644c65646765725365637265744b6579466f724a5754546f6b656e56616c69646174696f6e32303236
    access-token-expiration-ms: 3600000
    refresh-token-expiration-ms: 86400000
  outbox:
    enabled: false
